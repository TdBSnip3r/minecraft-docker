services:
  minecraft:
    build: .
    container_name: minecraft-forge-server
    ports:
      - "25565:25565"  # Porta del server Minecraft
    environment:
      # Configurazioni essenziali
      - EULA=true
      - MEMORY=4G
      - TYPE=FORGE
      - FORGE_VERSION=1.21.1-52.1.3
      # Configurazioni del server
      - ONLINE_MODE=false
      - ENABLE_WHITELIST=false
      - ENFORCE_WHITELIST=false
    volumes:
      - minecraft_data:/data
      - ./mods:/data/mods
      - ./plugins:/data/plugins
    restart: unless-stopped
    stdin_open: true
    tty: true

volumes:
  minecraft_data:
    driver: local
